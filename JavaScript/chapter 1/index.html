<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .content {
            padding: 40px;
        }

        /* Watermark only while printing */
        @media print {

            .watermark {
                position: fixed;
                top: 40%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(-45deg);

                font-size: 80px;
                font-weight: bold;
                color: rgba(0, 0, 0, 0.12);

                z-index: -1;
                pointer-events: none;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
        <div class="watermark">Workspace</div>

    <div class="content">
        <p>Practice Workspace of JavaScript</p>
    </div>
    <script src="first.js"></script>
</body>
</html>
