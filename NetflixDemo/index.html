<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>

    <link rel="icon" type="image/png" sizes="32x32" href="n.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="img">

    <div class="header">
        <p class="logo">NETFLIX</p>

        <div class="right-section">
            <div class="language-box">
                <span class="icon"><i class="fa-solid fa-language"></i></span>
                <select id="lang">
                    <option value="english">English</option>
                    <option value="hindi">हिंदी</option>
                    <option value="kannada">ಕನ್ನಡ</option>
                </select>
            </div>

            <button id="sign-in">Sign In</button>
        </div>  
    </div>

    <div class="header2">
        <p id="welcome_text">Unlimited movies,<br>shows and more</p>

        <p id="sub_text">
            Starts at ₹149. Cancel at any time.<br><br>
            Ready to watch? Enter your email to create or restart your membership.
        </p>

        <div class="creds">
            <input type="email" placeholder="Email address" id="email" required>
            <button id="get_started">Get Started ></button>
        </div>
        
    </div>
</div>

<br>
<hr class="curve">
<h3 id="buttomText">Trending now</h3>
<div class="image-section">
    <div class="grid">
        <div><img src="Dhurandhar.png" alt="image" class="trending"></div>
        <div><img src="kapil.png" alt="image" class="trending"></div>
        <div><img src="paradise.png" alt="image" class="trending"></div>
        <div><img src="peddi.png" alt="image" class="trending"></div>
        <div><img src="toxic.png" alt="image" class="trending"></div>
        <div><img src="rrr.png" alt="image" class="trending"></div>
        <div><img src="border2.png" alt="image" class="trending"></div>
    </div>
</div>

<h3 id="buttomText">More reasons to join</h3>
<div>
    
</div>

</body>
</html>
