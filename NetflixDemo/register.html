<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NETPRIME</title>
    <link rel="icon" type="image/png" sizes="32x32" href="n.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a0000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: rgba(0, 0, 0, 0.85);
            padding: 60px 50px;
            border-radius: 10px;
            box-shadow: 0 10px 50px rgba(255, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255, 0, 0, 0.2);
        }

        .logo {
            color: #e50914;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 2px 2px 10px rgba(229, 9, 20, 0.5);
        }

        h2 {
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(51, 51, 51, 0.8);
            border: 1px solid #333;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #e50914;
            background: rgba(51, 51, 51, 1);
        }

        input::placeholder {
            color: #999;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #e50914;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #f40612;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(229, 9, 20, 0.4);
        }

        .links {
            text-align: center;
            margin-top: 25px;
            color: #999;
        }

        .links a {
            color: #e50914;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #f40612;
            text-decoration: underline;
        }

        .error-message {
            background: rgba(229, 9, 20, 0.2);
            border: 1px solid #e50914;
            color: white;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .success-message {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: white;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        @media (max-width: 600px) {
            .register-container {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">NETPRIME</div>
        <h2>Create Account</h2>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form onsubmit="register(event)">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="newUser" placeholder="Username" required minlength="3">
            </div>

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="newPass" placeholder="Password" required minlength="6">
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="confirmPass" placeholder="Confirm Password" required minlength="6">
            </div>

            <button type="submit">Create Account</button>
        </form>

        <div class="links">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
