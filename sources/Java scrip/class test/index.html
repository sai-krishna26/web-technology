<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>basic form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"/>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
      <script src="script.js"></script>

      <style>
        #form
        {
            border: 4px;
            padding: 60px;
        }
      </style>
  </head>
  <body>
    <fieldset>
    <form class="end g-6" id="form">
      <div class="col-md-4">
        <label for="inputname4" class="form-label">name</label>
        <input type="text" class="form-control" id="inputname4">
      </div>

      <div class="col-md-4">
        <label for="inputusn" class="form-label">USN</label>
        <input type="text" class="form-control" id="inputusn" />
      </div>

       <div class="col-md-4">
        <label for="inputphnumber" class="form-label">Mobile Number</label>
        <input type="number" class="form-control" id="inputphnumber" />
      </div>

      <div class="col-md-4">
        <label for="inputEmail4" class="form-label">Email</label>
        <input type="email" class="form-control" id="inputEmail4" />
      </div>

      <div class="col-md-4">
        <label for="inputPassword4" class="form-label">Password</label>
        <input type="password" class="form-control" id="inputPassword4" />
      </div>

      <div class="col-12">
        <label for="inputAddress" class="form-label">Address</label>
        <input
          type="text"
          class="form-control"
          id="inputAddress"
          placeholder="1234 Main St"
        />
      </div>
      <br>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="gridCheck" />
          <label class="form-check-label" for="gridCheck"> agree</label>
        </div>
      </div>
      <br>
      <div class="col-12">
        <button type="submit" class="btn btn-primary" onclick="validateForm(event)">Submit</button>

      </div>
    </form>
  </body>
</html>
